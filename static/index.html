<style>
  * { box-sizing: border-box; }

  :root {
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0e1014;
    overflow: hidden;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }

  /* position:fixed always matches the visual viewport — immune to the iOS 100vh bug */
  #root {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* ─── App shell ─────────────────────────────────────────── */
  /* position:absolute with all four anchors = definite size on every browser,
     including iOS Safari where height:100% of a fixed parent is unresolvable. */
  .app-root {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Every direct child of app-root is a screen container in a flex column.
     min-height:0 lets them shrink below their content size so the layout
     stays within the viewport and overflow:auto actually scrolls. */
  .app-root > * { min-height: 0; }

  /* Desktop / tablet: phone-framed appearance */
  @media (min-height: 900px) and (min-width: 520px) {
    .app-root {
      position: relative;
      top: auto; left: auto; right: auto; bottom: auto;
      width: 412px;
      height: 892px;
      border-radius: 44px;
      border: 8px solid #2a2c33;
      box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.04);
      padding-top: 0;
    }
  }

  /* ─── Theme tokens ──────────────────────────────────────── */
  .app-root[data-theme="dark"] {
    --bg: #101218;
    --surface: #161922;
    --surface-2: #1c1f2a;
    --surface-3: #232634;
    --text: #e8eaef;
    --text-dim: #8b91a0;
    --text-faint: #5a606e;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.4);
    --paper: #f3efe6;
    --paper-ink: #1a1814;
  }
  .app-root[data-theme="light"] {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f3;
    --surface-3: #f0ede5;
    --text: #14161b;
    --text-dim: #5d6470;
    --text-faint: #9aa1ae;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.16);
    --shadow: 0 8px 24px rgba(20,22,27,0.08);
    --paper: #ffffff;
    --paper-ink: #1a1814;
  }

  /* ─── Accent colours ────────────────────────────────────── */
  .app-root[data-accent="green"]  { --accent: oklch(0.74 0.14 152); --accent-on: #07140f; --accent-soft: oklch(0.74 0.14 152 / 0.16); --accent-line: oklch(0.74 0.14 152 / 0.32); }
  .app-root[data-accent="blue"]   { --accent: oklch(0.72 0.13 245); --accent-on: #07101c; --accent-soft: oklch(0.72 0.13 245 / 0.16); --accent-line: oklch(0.72 0.13 245 / 0.32); }
  .app-root[data-accent="amber"]  { --accent: oklch(0.80 0.13 78);  --accent-on: #1a1306; --accent-soft: oklch(0.80 0.13 78  / 0.16); --accent-line: oklch(0.80 0.13 78  / 0.32); }
  .app-root[data-accent="violet"] { --accent: oklch(0.72 0.14 305); --accent-on: #160a1e; --accent-soft: oklch(0.72 0.14 305 / 0.16); --accent-line: oklch(0.72 0.14 305 / 0.32); }

  /* ─── Font stacks ───────────────────────────────────────── */
  .app-root[data-font="plex"]  { --font-sans: 'IBM Plex Sans', system-ui, sans-serif;     --font-display: 'IBM Plex Sans', system-ui, sans-serif; --font-serif: 'IBM Plex Serif', serif;      --font-mono: 'IBM Plex Mono', monospace; --display-weight: 600; --display-tracking: -0.01em; }
  .app-root[data-font="dm"]    { --font-sans: 'DM Sans', system-ui, sans-serif;            --font-display: 'DM Serif Display', serif;              --font-serif: 'DM Serif Display', serif;   --font-mono: 'IBM Plex Mono', monospace; --display-weight: 400; --display-tracking: -0.015em; }
  .app-root[data-font="space"] { --font-sans: 'Space Grotesk', system-ui, sans-serif;      --font-display: 'Space Grotesk', system-ui, sans-serif; --font-serif: 'Lora', serif;               --font-mono: 'IBM Plex Mono', monospace; --display-weight: 600; --display-tracking: -0.02em; }

  /* ─── Radius scale ──────────────────────────────────────── */
  .app-root[data-radius="sharp"] { --r-xs: 4px;  --r-sm: 6px;  --r-md: 10px; --r-lg: 14px; --r-xl: 18px; }
  .app-root[data-radius="soft"]  { --r-xs: 8px;  --r-sm: 12px; --r-md: 18px; --r-lg: 24px; --r-xl: 32px; }
  .app-root[data-radius="pill"]  { --r-xs: 10px; --r-sm: 16px; --r-md: 24px; --r-lg: 32px; --r-xl: 48px; }

  /* ─── Primitive utilities ───────────────────────────────── */
  .btn {
    appearance: none; border: 0; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 500; letter-spacing: -0.005em;
    border-radius: var(--r-md);
    padding: 14px 20px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: var(--accent-on); }
  .btn-ghost   { background: transparent; color: var(--text-dim); }
  .btn-soft    { background: var(--surface-2); color: var(--text); }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-dim); font-size: 12px; font-weight: 500; border: 1px solid var(--border); }

  /* ─── Animations ────────────────────────────────────────── */
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.8s ease-in-out infinite; }

  @keyframes pulse   { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes fadeUp  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes wave    { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  /* ─── Scrollbars ────────────────────────────────────────── */
  .phone-scroll { min-height: 0; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .phone-scroll::-webkit-scrollbar { width: 4px; }
  .phone-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  /* ─── Sheet animations ──────────────────────────────────── */
  .sheet-overlay { animation: fadeIn .18s ease both; }
  .sheet-panel   { animation: fadeUp .25s cubic-bezier(0.2,0.8,0.2,1) both; }

  /* ─── Press feedback ────────────────────────────────────── */
  .tap { transition: transform .12s ease, background .12s ease; }
  .tap:active { transform: scale(0.97); }

  /* ─── Toast ─────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: var(--r-md); padding: 12px 20px; font-size: 13.5px;
    box-shadow: var(--shadow); z-index: 100; white-space: nowrap;
    animation: fadeUp .25s ease both;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Pinned React + Babel -->

<script>
  // Reliable safe-area detection for Android/MIUI where env(safe-area-inset-bottom) returns 0.
  // Three methods tried in order; smallest positive value wins (guards against keyboard inflation).
  (function () {
    var applied = 0;

    function measure() {
      // 1. Probe env() directly — works on iOS and some Android
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden;';
      document.body.appendChild(probe);
      var envH = probe.offsetHeight;
      document.body.removeChild(probe);
      if (envH > 0) return envH;

      // 2. visualViewport gap — works when Chrome correctly excludes the nav bar
      var vv = window.visualViewport;
      if (vv) {
        var gap = Math.round(window.innerHeight - vv.offsetTop - vv.height);
        if (gap > 4) return gap;
      }

      // 3. Android screen heuristic — if innerHeight ≈ screen.height (only status bar removed),
      //    the layout is behind the nav bar. Standard Android 3-button nav bar = 48 dp.
      if (/Android/i.test(navigator.userAgent)) {
        var diff = window.screen.height - window.innerHeight;
        if (diff >= 0 && diff < 40) return 48;
      }

      return 0;
    }

    function update() {
      var val = measure();
      // Only decrease: keyboard open inflates the gap, we never want that value
      if (val > 0 && (applied === 0 || val < applied)) {
        applied = val;
        document.documentElement.style.setProperty('--safe-bottom', val + 'px');
      }
    }

    document.addEventListener('DOMContentLoaded', update);
    window.addEventListener('load', update);
    setTimeout(update, 400); // retry after layout settles
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        // Skip if keyboard is open (height dropped >25%)
        if (window.visualViewport.height > window.innerHeight * 0.75) update();
      });
    }
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(console.warn);
    });
  }
</script>
